version = "0.1.0"
description = ""
authors = [
    {name = "k0dima",email = "214964089+k0dima@users.noreply.github.com"}
]
requires-python = ">=3.13,<4.0"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.53.0,<0.54.0)",
